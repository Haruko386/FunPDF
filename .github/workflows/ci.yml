name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Format check
        run: |
          unformatted="$(git ls-files '*.go' -z | xargs -0 -r gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      - name: Build frontend for desktop embed
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Copy frontend assets for desktop embed
        run: |
          mkdir -p desktop/frontend
          cp -R web/dist desktop/frontend/

      - name: Test
        run: go test -race -cover ./...

      - name: Build
        run: go build -v ./...
