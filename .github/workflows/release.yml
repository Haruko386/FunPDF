name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify NSIS
        shell: pwsh
        run: makensis -VERSION

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build:desktop

      - name: Build Windows desktop executable
        working-directory: desktop
        shell: pwsh
        run: |
          wails build -clean -nsis -ldflags "-s -w -X FunPDF/internal/common.version=${{ github.ref_name }}"
          $installer = Get-ChildItem build/bin -Filter "*installer*.exe" | Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer was not generated under desktop/build/bin"
          }
          Copy-Item $installer.FullName "../FunPDF-Installer-${{ github.ref_name }}.exe"

      - name: Package portable app
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $packageDir = "FunPDF-$version-windows"
          New-Item -ItemType Directory -Force $packageDir | Out-Null
          Copy-Item desktop/build/bin/FunPDF.exe "$packageDir/FunPDF.exe"
          Copy-Item LICENSE "$packageDir/LICENSE"
          Copy-Item README.md "$packageDir/README.md"
          Copy-Item desktop/README.md "$packageDir/README-Desktop.md"
          Compress-Archive -Path "$packageDir/*" -DestinationPath "FunPDF-$version-windows.zip" -Force

      - name: Generate installer checksum
        shell: pwsh
        run: |
          Get-FileHash FunPDF-Installer-${{ github.ref_name }}.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  FunPDF-Installer-${{ github.ref_name }}.exe" } | Set-Content FunPDF-Installer-${{ github.ref_name }}.exe.sha256

      - name: Remove old release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $assetsJson = gh release view "${{ github.ref_name }}" --json assets --jq ".assets[].name" 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Release ${{ github.ref_name }} does not exist yet; no assets to remove."
            exit 0
          }
          $assetsJson | ForEach-Object {
            if ($_ -ne "") {
              gh release delete-asset "${{ github.ref_name }}" $_ --yes
            }
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FunPDF-Installer-${{ github.ref_name }}.exe
            FunPDF-Installer-${{ github.ref_name }}.exe.sha256
            FunPDF-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
