name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify NSIS
        shell: pwsh
        run: makensis -VERSION

      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Copy frontend assets for desktop embed
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force desktop/frontend | Out-Null
          Copy-Item -Recurse -Force web/dist desktop/frontend/

      - name: Build Windows server executable
        run: |
          go build -trimpath -ldflags "-s -w -X FunPDF/internal/common.version=${{ github.ref_name }}" -o FunPDF-Server-${{ github.ref_name }}.exe .

      - name: Build Windows desktop executable
        working-directory: desktop
        shell: pwsh
        run: |
          wails build -clean -nsis -ldflags "-s -w -X FunPDF/internal/common.version=${{ github.ref_name }}"
          Copy-Item build/bin/FunPDF.exe ../FunPDF-Desktop-${{ github.ref_name }}.exe
          $installer = Get-ChildItem build/bin -Filter "*installer*.exe" | Select-Object -First 1
          if ($null -eq $installer) {
            throw "NSIS installer was not generated under desktop/build/bin"
          }
          Copy-Item $installer.FullName "../FunPDF-Installer-${{ github.ref_name }}.exe"

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash FunPDF-Server-${{ github.ref_name }}.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  FunPDF-Server-${{ github.ref_name }}.exe" } | Set-Content FunPDF-Server-${{ github.ref_name }}.exe.sha256
          Get-FileHash FunPDF-Desktop-${{ github.ref_name }}.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  FunPDF-Desktop-${{ github.ref_name }}.exe" } | Set-Content FunPDF-Desktop-${{ github.ref_name }}.exe.sha256
          Get-FileHash FunPDF-Installer-${{ github.ref_name }}.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  FunPDF-Installer-${{ github.ref_name }}.exe" } | Set-Content FunPDF-Installer-${{ github.ref_name }}.exe.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FunPDF-Server-${{ github.ref_name }}.exe
            FunPDF-Server-${{ github.ref_name }}.exe.sha256
            FunPDF-Desktop-${{ github.ref_name }}.exe
            FunPDF-Desktop-${{ github.ref_name }}.exe.sha256
            FunPDF-Installer-${{ github.ref_name }}.exe
            FunPDF-Installer-${{ github.ref_name }}.exe.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
